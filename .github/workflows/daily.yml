name: Daily MariaDB image

on:
  schedule:
    # Daily rebuild at 04:32 UTC
    - cron: '32 4 * * *'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mariadb_118_version:
        description: 'Override MariaDB 11.8 version (leave empty for latest 11.8.x)'
        required: false
        default: ''
      mariadb_123_version:
        description: 'Override MariaDB 12.3 version (leave empty for latest 12.3.x)'
        required: false
        default: ''
      gosu_version:
        description: 'Override gosu version (leave empty for Dockerfile default)'
        required: false
        default: ''
      go_version:
        description: 'Override Go version for building gosu (leave empty for Dockerfile default)'
        required: false
        default: ''
      force_push:
        description: 'Push even if only docs changed (requires Docker Hub secrets)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: dgcosenza/mariadb
  MARIADB_118_DEFAULT: '11.8.10'
  MARIADB_123_DEFAULT: '12.3.4'
  GOSU_VERSION_DEFAULT: '1.20'
  GO_VERSION_DEFAULT: '1.25.7'
  GPG_KEYS_118: '177F4010FE56CA3336300305F1656F24C74CD1D8'
  GPG_KEYS_123: '177F4010FE56CA3336300305F1656F24C74CD1D8'

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: '11.8'
            tag_suffix: '11.8'
            default_version: ${{ env.MARIADB_118_DEFAULT }}
            override_version: ${{ inputs.mariadb_118_version }}
            gpg_keys: ${{ env.GPG_KEYS_118 }}
          - major: '12.3'
            tag_suffix: '12.3'
            default_version: ${{ env.MARIADB_123_DEFAULT }}
            override_version: ${{ inputs.mariadb_123_version }}
            gpg_keys: ${{ env.GPG_KEYS_123 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve upstream MariaDB versions
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          MAJOR="${{ matrix.major }}"
          OVERRIDE="${{ matrix.override_version }}"
          DEFAULT="${{ matrix.default_version }}"
          GPG_KEYS="${{ matrix.gpg_keys }}"

          if [ -n "$OVERRIDE" ]; then
            VERSION="$OVERRIDE"
            echo "Using override version: $VERSION"
          else
            # Query MariaDB releases API for latest patch in the major series
            # GitHub API: list releases, filter by tag_name starting with mariadb-{major}.
            RELEASES=$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/MariaDB/server/releases?per_page=100")

            VERSION=$(printf '%s' "$RELEASES" | python3 - "$MAJOR" <<'PY'
import sys, json, re
major = sys.argv[1]
releases = json.load(sys.stdin)
# Find latest stable (non-prerelease) for this major series
pattern = re.compile(r'^mariadb-' + re.escape(major) + r'\.(\d+)$')
candidates = []
for r in releases:
    if r.get('prerelease') or r.get('draft'):
        continue
    m = pattern.match(r['tag_name'])
    if m:
        candidates.append((int(m.group(1)), r['tag_name']))
if not candidates:
    sys.exit(1)
candidates.sort(reverse=True)
# Return version like "11.8.10"
tag = candidates[0][1]
print(tag.replace('mariadb-', ''))
PY
            )
            if [ -z "$VERSION" ]; then
              echo "ERROR: Could not resolve latest MariaDB ${MAJOR} version" >&2
              exit 1
            fi
            echo "Resolved latest MariaDB ${MAJOR}: ${VERSION}"
          fi

          # Validate version format (x.y.z)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid version format: $VERSION" >&2
            exit 1
          fi

          GOSU_VERSION="${{ inputs.gosu_version }}"
          [ -z "$GOSU_VERSION" ] && GOSU_VERSION="${GOSU_VERSION_DEFAULT}"

          GO_VERSION="${{ inputs.go_version }}"
          [ -z "$GO_VERSION" ] && GO_VERSION="${GO_VERSION_DEFAULT}"

          BUILD_DATE=$(date -u +"%Y%m%d")
          CREATED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          {
            echo "mariadb_version=$VERSION"
            echo "mariadb_major=$MAJOR"
            echo "tag_suffix=${{ matrix.tag_suffix }}"
            echo "gpg_keys=$GPG_KEYS"
            echo "gosu_version=$GOSU_VERSION"
            echo "go_version=$GO_VERSION"
            echo "build_date=$BUILD_DATE"
            echo "created=$CREATED"
          } >> "$GITHUB_OUTPUT"

          echo "MariaDB ${MAJOR} version: ${VERSION}"
          echo "gosu version: ${GOSU_VERSION}"
          echo "Go version: ${GO_VERSION}"
          echo "Build date: ${BUILD_DATE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build linux/amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: |
            ${{ env.IMAGE_NAME }}:ci-candidate-${{ matrix.tag_suffix }}
          build-args: |
            MARIADB_MAJOR=${{ steps.resolve.outputs.mariadb_major }}
            MARIADB_VERSION=${{ steps.resolve.outputs.mariadb_version }}
            GPG_KEYS=${{ steps.resolve.outputs.gpg_keys }}
            GOSU_VERSION=${{ steps.resolve.outputs.gosu_version }}
            GO_VERSION=${{ steps.resolve.outputs.go_version }}
            IMAGE_CREATED=${{ steps.resolve.outputs.created }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}

      - name: Smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          ./tests/smoke.sh "${{ env.IMAGE_NAME }}:ci-candidate-${{ matrix.tag_suffix }}" "${{ matrix.major }}"

      - name: Scan image with Trivy — full report (informational)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:ci-candidate-${{ matrix.tag_suffix }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Scan image with Trivy — HARD GATE (fail on any fixable CRITICAL or HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:ci-candidate-${{ matrix.tag_suffix }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan image with Grype (artifact)
        uses: anchore/scan-action@v6
        with:
          image: '${{ env.IMAGE_NAME }}:ci-candidate-${{ matrix.tag_suffix }}'
          output-format: 'table'
          fail-build: false
          severity-cutoff: 'high'

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: '${{ env.IMAGE_NAME }}:ci-candidate-${{ matrix.tag_suffix }}'
          format: 'spdx-json'
          output-file: 'sbom-${{ matrix.tag_suffix }}.spdx.json'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.tag_suffix }}
          path: sbom-${{ matrix.tag_suffix }}.spdx.json
          retention-days: 30

      - name: Check Docker Hub publish credentials
        id: hub_auth
        shell: bash
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "can_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Docker Hub push (PR event or DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not configured)."
          fi

      - name: Log in to Docker Hub
        if: steps.hub_auth.outputs.can_publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push verified image to Docker Hub
        if: steps.hub_auth.outputs.can_publish == 'true'
        id: push
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ env.IMAGE_NAME }}:${{ steps.resolve.outputs.mariadb_version }}-${{ steps.resolve.outputs.build_date }}"
          COMMIT_TAG="${{ env.IMAGE_NAME }}:${{ steps.resolve.outputs.mariadb_version }}"
          MAJOR_TAG="${{ env.IMAGE_NAME }}:${{ steps.resolve.outputs.tag_suffix }}"
          LATEST_TAG="${{ env.IMAGE_NAME }}:latest-${{ steps.resolve.outputs.tag_suffix }}"

          for tag in "$IMAGE_TAG" "$COMMIT_TAG" "$MAJOR_TAG" "$LATEST_TAG"; do
            docker tag "${{ env.IMAGE_NAME }}:ci-candidate-${{ matrix.tag_suffix }}" "$tag"
            docker push "$tag"
          done

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$LATEST_TAG")
          echo "Published digest for ${{ matrix.tag_suffix }}: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ steps.resolve.outputs.mariadb_version }}-${{ steps.resolve.outputs.build_date }}" >> "$GITHUB_OUTPUT"

          {
            echo "Built MariaDB ${{ steps.resolve.outputs.mariadb_version }} (${{ matrix.major }} series)."
            echo "Debian base: debian:trixie-slim, upgraded during this run."
            echo "gosu rebuilt with Go ${{ steps.resolve.outputs.go_version }}."
            echo "Trivy scan passed with no fixable critical or high findings."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read Docker Hub short description
        if: steps.hub_auth.outputs.can_publish == 'true'
        id: short_desc
        shell: bash
        run: |
          set -euo pipefail
          DESC=$(tr -d '\r\n' < DOCKERHUB_SHORT_DESCRIPTION)
          if [ "${#DESC}" -gt 100 ]; then
            echo "ERROR: DOCKERHUB_SHORT_DESCRIPTION exceeds 100 characters (${#DESC})" >&2
            exit 1
          fi
          echo "text=${DESC}" >> "$GITHUB_OUTPUT"

      - name: Sync Docker Hub repository overview (short & full description)
        if: steps.hub_auth.outputs.can_publish == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: ${{ steps.short_desc.outputs.text }}
          readme-filepath: ./README.md