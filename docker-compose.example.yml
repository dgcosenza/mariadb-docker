services:
  mariadb11:
    image: dgcosenza/mariadb:11.8
    container_name: mariadb11
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run/mysqld:uid=999,gid=999,mode=1777,size=16m
      - /tmp:mode=1777,size=128m
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=myapp
      - MARIADB_USER=myapp
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - mariadb11_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app_internal
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M

  mariadb12:
    image: dgcosenza/mariadb:12.3
    container_name: mariadb12
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run/mysqld:uid=999,gid=999,mode=1777,size=16m
      - /tmp:mode=1777,size=128m
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB12_ROOT_PASSWORD}
      - MARIADB_DATABASE=forum
      - MARIADB_USER=forum
      - MARIADB_PASSWORD=${MARIADB12_PASSWORD}
    volumes:
      - mariadb12_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - forum_internal
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M

volumes:
  mariadb11_data:
  mariadb12_data:

networks:
  app_internal:
    internal: true
  forum_internal:
    internal: true
